<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge — AI Agent</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #ff7b29;
    --accent-dim: #ff7b2933;
    --user: #1f6feb;
    --tool: #3fb950;
    --error: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
  }
  .logo-mark {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent), #ff4422);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .logo-sub { color: var(--muted); font-weight: 400; font-size: 13px; }
  header button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { background: var(--border); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .nav-link {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    text-decoration: none;
  }
  .nav-link:hover { border-color: var(--accent); color: var(--accent); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 280px;
    overflow: hidden;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }

  .chat {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: white;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .msg.tool {
    align-self: flex-start;
    background: var(--panel-2);
    border-left: 3px solid var(--tool);
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
    max-width: 95%;
  }
  .msg.error {
    align-self: flex-start;
    background: #2d1416;
    border-left: 3px solid var(--error);
    color: #ffb3b3;
  }
  .tool-step {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
  }
  .tool-step-icon { color: var(--accent); }
  .tool-step-status { font-weight: 700; }

  .tool-header {
    color: var(--tool);
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tool-body { color: var(--muted); }
  .tool-body details { cursor: pointer; }
  .tool-body summary { padding: 4px 0; }
  .tool-body pre {
    margin-top: 6px;
    background: #0d1117;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12px;
    max-height: 300px;
    overflow-y: auto;
  }

  .composer {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .composer-inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 900px;
    margin: 0 auto;
  }
  textarea {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    resize: none;
    font-family: inherit;
    font-size: 14.5px;
    min-height: 48px;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 22px;
    height: 48px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .send-btn:hover { background: #ff6a14; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .sidebar {
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 18px;
  }
  .sidebar h3 {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .file-list { display: flex; flex-direction: column; gap: 4px; }
  .file-item {
    padding: 8px 10px;
    background: var(--panel-2);
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .file-item:hover { background: var(--border); }
  .file-item .size { color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 0;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3 } 40% { opacity: 1 } }

  .welcome {
    text-align: center;
    color: var(--muted);
    margin: auto;
    max-width: 480px;
    padding: 40px 20px;
  }
  .welcome h2 { color: var(--text); margin-bottom: 12px; font-size: 24px; }
  .welcome .examples {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 24px;
  }
  .example {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font-size: 13.5px;
    transition: border-color 0.15s;
  }
  .example:hover { border-color: var(--accent); }
  @media (max-width: 600px) {
    .welcome .examples { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-mark">⚒</div>
      <div>
        Forge
        <span class="logo-sub">— Local AI Agent</span>
      </div>
    </div>
    <div class="header-actions">
      <a class="nav-link" href="/dashboard">Dashboard</a>
      <button id="resetBtn">New Chat</button>
    </div>
  </header>

  <main>
    <section class="chat">
      <div class="messages" id="messages">
        <div class="welcome" id="welcome">
          <h2>What should we build today?</h2>
          <p>Forge can create files, run code, search the web, and execute shell commands — all locally.</p>
          <div class="examples">
            <button class="example" data-prompt="Build a Snake game as a single index.html file with HTML, CSS, and JavaScript.">🎮 Build a Snake game</button>
            <button class="example" data-prompt="Create a personal portfolio website with a dark theme. Single HTML file.">🌐 Make a portfolio site</button>
            <button class="example" data-prompt="Write a Python script that fetches the current weather for Berlin and prints it.">🐍 Python weather script</button>
            <button class="example" data-prompt="Search the web for the latest news about AI and summarize the top 3 stories.">🔎 Summarize AI news</button>
          </div>
        </div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea id="input" placeholder="Ask Forge to build something... (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <h3>Workspace Files</h3>
      <div class="file-list" id="fileList">
        <div class="empty">No files yet. Ask Forge to build something!</div>
      </div>
    </aside>
  </main>

<script>
const API = window.location.origin;
const messagesEl = document.getElementById("messages");
const welcomeEl = document.getElementById("welcome");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const fileListEl = document.getElementById("fileList");

let isStreaming = false;

function autosize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
}
inputEl.addEventListener("input", autosize);

function addMessage(role, content, opts = {}) {
  if (welcomeEl) welcomeEl.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (opts.html) div.innerHTML = content; else div.textContent = content;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// Compact, single-line progress step (no argument/output clutter).
function addToolStep(name) {
  if (welcomeEl) welcomeEl.remove();
  const div = document.createElement("div");
  div.className = "tool-step";
  div.innerHTML = `<span class="tool-step-icon">⚒</span> <span>${escapeHtml(name)}</span><span class="tool-step-status">…</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function resolveToolStep(div, ok) {
  if (!div) return;
  const status = div.querySelector(".tool-step-status");
  if (status) {
    status.textContent = ok ? "✓" : "✗";
    status.style.color = ok ? "var(--tool)" : "var(--error)";
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function refreshFiles() {
  try {
    const res = await fetch(`${API}/api/workspace`);
    const data = await res.json();
    if (!data.files || data.files.length === 0) {
      fileListEl.innerHTML = `<div class="empty">No files yet. Ask Forge to build something!</div>`;
      return;
    }
    fileListEl.innerHTML = data.files.map(f => `
      <a class="file-item" href="${API}/api/workspace/file?path=${encodeURIComponent(f.path)}" target="_blank">
        <span>${escapeHtml(f.path)}</span>
        <span class="size">${formatSize(f.size)}</span>
      </a>
    `).join("");
  } catch (e) {
    console.error(e);
  }
}

function formatSize(b) {
  if (b < 1024) return b + " B";
  if (b < 1024*1024) return (b/1024).toFixed(1) + " KB";
  return (b/(1024*1024)).toFixed(1) + " MB";
}

async function send() {
  const message = inputEl.value.trim();
  if (!message || isStreaming) return;
  isStreaming = true;
  sendBtn.disabled = true;

  addMessage("user", message);
  inputEl.value = "";
  autosize();

  const typingDiv = document.createElement("div");
  typingDiv.className = "msg assistant";
  typingDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(typingDiv);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message}),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let typingRemoved = false;
    let currentToolStep = null;

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const parts = buffer.split("\n\n");
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith("data: ")) continue;
        const evt = JSON.parse(part.slice(6));

        if (!typingRemoved) { typingDiv.remove(); typingRemoved = true; }

        if (evt.type === "thinking" && evt.content) {
          addMessage("assistant", evt.content);
        } else if (evt.type === "tool_call") {
          currentToolStep = addToolStep(evt.name);
        } else if (evt.type === "tool_result") {
          resolveToolStep(currentToolStep, evt.result && evt.result.success !== false);
          currentToolStep = null;
        } else if (evt.type === "final") {
          if (evt.content && evt.content.trim()) {
            // 'final' content already shown via thinking — skip duplicate
          }
        } else if (evt.type === "error") {
          addMessage("error", evt.content);
        }
      }
    }
    if (!typingRemoved) typingDiv.remove();
    await refreshFiles();
  } catch (e) {
    typingDiv.remove();
    addMessage("error", "Connection error: " + e.message);
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetBtn.addEventListener("click", async () => {
  await fetch(`${API}/api/reset`, {method: "POST"});
  messagesEl.innerHTML = "";
  messagesEl.appendChild(welcomeEl || document.createElement("div"));
  location.reload();
});

document.querySelectorAll(".example").forEach(btn => {
  btn.addEventListener("click", () => {
    inputEl.value = btn.dataset.prompt;
    autosize();
    send();
  });
});

refreshFiles();
setInterval(refreshFiles, 5000);
</script>
</body>
</html>
